name: Version automatique

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: auto-version-master
  cancel-in-progress: false

jobs:
  tag:
    name: Calculer et publier la version
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt et tous les tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Créer le prochain tag sémantique
        shell: bash
        run: |
          set -euo pipefail

          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Le commit courant possède déjà une version."
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          latest_tag="${latest_tag:-v0.0.0}"
          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"

          if [ "$latest_tag" = "v0.0.0" ]; then
            range="HEAD"
          else
            range="${latest_tag}..HEAD"
          fi

          messages="$(git log "$range" --format='%s%n%b')"

          if printf '%s\n' "$messages" | grep -Eqi 'BREAKING[ -]CHANGE|^[a-z]+(\([^)]*\))?!:'; then
            major=$((major + 1))
            minor=0
            patch=0
            release_type="majeure"
          elif printf '%s\n' "$messages" | grep -Eqi '^feat(\([^)]*\))?:'; then
            minor=$((minor + 1))
            patch=0
            release_type="mineure"
          else
            patch=$((patch + 1))
            release_type="corrective"
          fi

          next_tag="v${major}.${minor}.${patch}"
          echo "Publication automatique ${release_type}: ${latest_tag} → ${next_tag}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Version ${next_tag} (${release_type})"
          git push origin "$next_tag"
